name: Deploy MI Operations Hub to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run build:worker

      - name: Configure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_database_id() {
            npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const databases = JSON.parse(input);
                const database = databases.find((entry) => entry.name === "mi-operations-hub");
                if (database) process.stdout.write(database.uuid ?? database.database_id ?? database.id ?? "");
              });
            '
          }
          database_id="$(find_database_id)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create mi-operations-hub
            database_id="$(find_database_id)"
          fi
          if [ -z "$database_id" ]; then
            echo "Unable to find or create the mi-operations-hub D1 database." >&2
            exit 1
          fi
          DATABASE_ID="$database_id" node <<'NODE'
          const fs = require("node:fs");
          const configPath = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const database = config.d1_databases?.find((entry) => entry.binding === "DB");
          if (!database) throw new Error("The DB binding is missing from wrangler.jsonc.");
          database.database_id = process.env.DATABASE_ID;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mi-operations-hub --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
